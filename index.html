<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>Discussion Portal</header>

  <div class="app">

    <!-- LEFT PANE -->
    <div class="left-pane">
      <div class="left-toolbar">
        <button class="btn-new" onclick="showNewQuestionForm()">New Question form</button>
        <input
          class="search-box"
          type="text"
          placeholder="search questions..."
          id="searchInput"
          oninput="filterQuestions()"
        >
      </div>
      <div class="questions-list" id="questionsList"></div>
    </div>

    <!-- RIGHT PANE -->
    <div class="right-pane" id="rightPane"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
